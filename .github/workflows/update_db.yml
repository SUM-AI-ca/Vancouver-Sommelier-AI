name: Update Wine Database

on:
  schedule:
    # Run Tue/Thu/Sat at 02:00 UTC (2 hours after submodule scraper runs Mon/Wed/Fri)
    - cron: '0 2 * * 2,4,6'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Update submodule to latest
      run: |
        git submodule update --remote --merge

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build database
      run: python build_db.py

    - name: Commit and push if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add gismondi-canada-wines data/wines.db
        if [ -n "$(git diff --cached --name-only)" ]; then
          git commit -m "chore: update wine database ($(date +'%Y-%m-%d'))"
          git push origin main
          echo "Database updated and pushed."
        else
          echo "No changes detected. Skipping commit."
        fi
