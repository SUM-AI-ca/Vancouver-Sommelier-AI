<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B3A50"/>
      <stop offset="100%" stop-color="#3D1525"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#FFD0E0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD0E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <circle cx="16" cy="12" r="8" fill="url(#glow)"/>

  <!-- Wine glass (single path to avoid overlap artifacts) -->
  <path d="M9.5 7 Q9.5 16.5, 16 18 Q22.5 16.5, 22.5 7 M16 18 L16 23.5 M12 23.5 L20 23.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Agent network edges -->
  <line x1="16" y1="9" x2="13" y2="13.5" stroke="#F4C0D0" stroke-width="0.7" opacity="0.5"/>
  <line x1="16" y1="9" x2="19" y2="13.5" stroke="#F4C0D0" stroke-width="0.7" opacity="0.5"/>
  <line x1="16" y1="9" x2="16" y2="16" stroke="#F4C0D0" stroke-width="0.7" opacity="0.5"/>
  <line x1="13" y1="13.5" x2="19" y2="13.5" stroke="#F4C0D0" stroke-width="0.5" opacity="0.35"/>
  <line x1="13" y1="13.5" x2="16" y2="16" stroke="#F4C0D0" stroke-width="0.5" opacity="0.35"/>
  <line x1="19" y1="13.5" x2="16" y2="16" stroke="#F4C0D0" stroke-width="0.5" opacity="0.35"/>

  <!-- Supervisor node (top, white, larger) -->
  <circle cx="16" cy="9" r="1.7" fill="#fff"/>
  <!-- 3 specialist agent nodes (pink, triangle) -->
  <circle cx="13" cy="13.5" r="1.2" fill="#F4C0D0"/>
  <circle cx="19" cy="13.5" r="1.2" fill="#F4C0D0"/>
  <circle cx="16" cy="16" r="1.2" fill="#F4C0D0"/>
</svg>
